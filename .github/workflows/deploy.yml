name: Deploy to Hostinger (FTP)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy-backend:
    name: Build & Deploy Backend (Laravel)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      frontend_dir: ${{ steps.detect-target.outputs.frontend_dir }}
      backend_dir: ${{ steps.detect-target.outputs.backend_dir }}
      target_dir: ${{ steps.detect-target.outputs.frontend_dir }}
      ftp_server: ${{ steps.detect-target.outputs.ftp_server }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, pdo_mysql, bcmath, curl, zip

      - name: Install Composer Dependencies
        working-directory: backend
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - name: Archive vendor into vendor.zip
        working-directory: backend
        run: |
          echo "Compressing vendor directory into vendor.zip..."
          zip -r -q vendor.zip vendor/
          echo "Vendor archive created: $(du -h vendor.zip | cut -f1)"

      - name: Generate Vendor Extraction Helper
        working-directory: backend
        run: |
          TOKEN=$(openssl rand -hex 16)
          echo "EXTRACT_TOKEN=$TOKEN" >> $GITHUB_ENV
          cat << 'EOF' > extract_vendor.php
          <?php
          error_reporting(E_ALL);
          ini_set('display_errors', 1);
          set_time_limit(300);

          $expectedToken = '__EXTRACT_TOKEN__';
          if (!isset($_GET['token']) || $_GET['token'] !== $expectedToken) {
              http_response_code(403);
              exit('Forbidden: Invalid extraction token.');
          }

          $baseDir = __DIR__;
          $candidates = [
              dirname($baseDir) . '/backend',
              $baseDir . '/backend',
              dirname($baseDir),
              $baseDir,
              '/home/u773098752/domains/archfit.archenterprises.co.in/backend',
              '/home/u773098752/backend',
          ];
          $targetBackend = null;
          foreach ($candidates as $cand) {
              if (file_exists($cand . '/vendor.zip') || file_exists($cand . '/artisan') || file_exists($cand . '/bootstrap/app.php')) {
                  $targetBackend = realpath($cand) ?: $cand;
                  break;
              }
          }
          if (!$targetBackend) {
              $targetBackend = dirname($baseDir) . '/backend';
          }

          $zipFile = $targetBackend . '/vendor.zip';
          if (!file_exists($zipFile)) {
              if (file_exists($targetBackend . '/vendor/autoload.php')) {
                  @unlink(__FILE__);
                  exit('SUCCESS: vendor is already installed.');
              }
              http_response_code(404);
              exit('vendor.zip not found in ' . $targetBackend);
          }

          if (!class_exists('ZipArchive')) {
              http_response_code(500);
              exit('ZipArchive PHP extension is not enabled.');
          }

          $zip = new ZipArchive;
          $res = $zip->open($zipFile);
          if ($res === TRUE) {
              $zip->extractTo($targetBackend);
              $zip->close();
              @unlink($zipFile);
              @unlink(__FILE__);
              echo "SUCCESS: vendor.zip extracted into external backend successfully.";
          } else {
              http_response_code(500);
              exit('Failed to extract vendor.zip. Code: ' . $res);
          }
          EOF
          sed -i "s/__EXTRACT_TOKEN__/$TOKEN/g" extract_vendor.php
          mkdir -p public
          cp extract_vendor.php public/extract_vendor.php

      - name: Auto-Detect, Migrate Legacy Backend & Prepare Directories
        id: detect-target
        env:
          FTP_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
          FTP_USER: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          OVERRIDE_DIR: ${{ secrets.HOSTINGER_SERVER_DIR }}
        run: |
          python3 - << 'PYEOF'
          import os, ftplib, sys, io, socket, time

          override = os.environ.get('OVERRIDE_DIR', '').strip()
          raw_server = os.environ.get('FTP_SERVER', '').strip()
          user = os.environ.get('FTP_USER', '').strip()
          password = os.environ.get('FTP_PASS', '').strip()

          frontend_dir = 'public_html/'
          backend_dir = 'backend/'

          # Build candidate servers list with IPv4 resolution
          candidates = []
          if raw_server:
              candidates.append(raw_server)
              if not raw_server.startswith('ftp.') and not raw_server.replace('.', '').isdigit():
                  candidates.append(f"ftp.{raw_server}")
          candidates.extend(['ftp.archfit.archenterprises.co.in', 'ftp.archenterprises.co.in', '145.79.210.95'])
          seen = set()
          candidate_servers = [c for c in candidates if c and not (c in seen or seen.add(c))]

          def connect_ftp():
              for s in candidate_servers:
                  try:
                      print(f"Testing FTP candidate: {s} on port 21...")
                      addr_info = socket.getaddrinfo(s, 21, socket.AF_INET, socket.SOCK_STREAM)
                      if not addr_info:
                          continue
                      ip = addr_info[0][4][0]
                      print(f"  -> Resolved {s} to IPv4: {ip}")

                      sock = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
                      sock.settimeout(6.0)
                      sock.connect((ip, 21))
                      sock.close()
                      print(f"  -> Port 21 is reachable on {s} ({ip})")

                      for use_tls in [True, False]:
                          try:
                              if use_tls:
                                  ftp = ftplib.FTP_TLS(timeout=30)
                                  ftp.connect(ip, 21)
                                  ftp.login(user, password)
                                  ftp.prot_p()
                                  ftp.set_pasv(True)
                                  print(f"  -> Connected successfully via FTPS (TLS) to {s} ({ip})!")
                                  return ftp, s
                              else:
                                  ftp = ftplib.FTP(timeout=30)
                                  ftp.connect(ip, 21)
                                  ftp.login(user, password)
                                  ftp.set_pasv(True)
                                  print(f"  -> Connected successfully via plain FTP to {s} ({ip})!")
                                  return ftp, s
                          except Exception as e:
                              print(f"     Login attempt ({'FTPS' if use_tls else 'FTP'}) on {s} failed: {e}")
                  except Exception as e:
                      print(f"  -> Could not reach {s}:21 ({e})")
              return None, None

          ftp = None
          working_server = raw_server
          try:
              ftp, working_server = connect_ftp()
              if not ftp:
                  raise Exception("Could not establish FTP connection to any candidate server.")

              pwd = ftp.pwd()
              raw_files = ftp.nlst()
              print(f"FTP initial PWD: {pwd}")
              print(f"FTP initial contents: {raw_files}")

              clean_files = [f.replace('\\', '/').split('/')[-1] for f in raw_files]

              # Determine if we are at home root (identified ONLY by the DO_NOT_UPLOAD_HERE marker)
              is_home_root = 'DO_NOT_UPLOAD_HERE' in clean_files

              if is_home_root:
                  print("FTP root is Home Directory (🏠).")
                  frontend_dir = 'public_html/'
                  backend_dir = 'backend/'
              else:
                  print("FTP root is NOT Home Directory (currently inside public_html).")
                  can_reach_parent = False
                  try:
                      ftp.cwd('..')
                      parent_clean = [f.replace('\\', '/').split('/')[-1] for f in ftp.nlst()]
                      print(f"Parent directory contents: {parent_clean}")
                      if 'DO_NOT_UPLOAD_HERE' in parent_clean:
                          print("Successfully verified parent directory is Home Root (🏠)!")
                          can_reach_parent = True
                      ftp.cwd(pwd)
                  except Exception as e:
                      print(f"Notice on checking parent directory: {e}")

                  if can_reach_parent:
                      print("Navigating outside public_html: backend='../backend/', frontend='./'")
                      backend_dir = '../backend/'
                      frontend_dir = './'
                  else:
                      print("WARNING: FTP account appears restricted to public_html directly.")
                      backend_dir = '../backend/'
                      frontend_dir = './'

              if override:
                  override_clean = override.strip('/')
                  print(f"HOSTINGER_SERVER_DIR provided: '{override}'")
                  if override_clean in ('public_html', './public_html', '/public_html', ''):
                      if is_home_root:
                          frontend_dir = 'public_html/'
                          backend_dir = 'backend/'
                      else:
                          frontend_dir = './'
                          backend_dir = '../backend/'
                  elif 'public_html' in override_clean:
                      base = override_clean.rsplit('public_html', 1)[0].rstrip('/')
                      frontend_dir = f"{override_clean}/"
                      backend_dir = f"{base}/backend/" if base else "backend/"
                  else:
                      frontend_dir = f"{override_clean}/public_html/"
                      backend_dir = f"{override_clean}/backend/"

              print(f"Final Resolved Target Frontend Dir: '{frontend_dir}'")
              print(f"Final Resolved Target Backend Dir:  '{backend_dir}'")

              # 1. Ensure backend directory exists outside public_html
              clean_backend = backend_dir.strip('/')
              if clean_backend and clean_backend not in ('.', '..'):
                  try:
                      ftp.mkd(clean_backend)
                      print(f"Verified/Created target backend directory: {clean_backend}")
                  except Exception:
                      print(f"Target backend directory ready: {clean_backend}")

              # 2. Inspect and clean unwanted directories inside public_html
              target_pub = frontend_dir if frontend_dir != './' else ''
              try:
                  pub_contents = [f.replace('\\', '/').split('/')[-1] for f in ftp.nlst(target_pub or '.')]
                  print(f"Current contents of public_html: {pub_contents}")

                  for unwanted in ['public_html', 'backend', 'backend_legacy', 'cleanup_nested_pub', 'cleanup_legacy_backend', 'nested_public_html_old']:
                      if unwanted in pub_contents:
                          bad_path = f"{target_pub}{unwanted}".lstrip('/')
                          print(f"Found unwanted folder inside public_html: {bad_path}")
                          if unwanted == 'backend':
                              try:
                                  has_env = any('.env' in x for x in ftp.nlst(backend_dir))
                                  if not has_env:
                                      bio = io.BytesIO()
                                      ftp.retrbinary(f"RETR {bad_path}/.env", bio.write)
                                      bio.seek(0)
                                      ftp.storbinary(f"STOR {backend_dir}.env", bio)
                                      print(f"Preserved .env from {bad_path}/.env into {backend_dir}.env!")
                              except Exception as e:
                                  print(f"Notice on .env transfer: {e}")
                          try:
                              ftp.rename(bad_path, f"{target_pub}to_delete_{unwanted}".lstrip('/'))
                              print(f"Renamed {bad_path} to to_delete_{unwanted}")
                          except Exception as e:
                              print(f"Notice on rename: {e}")
              except Exception as e:
                  print(f"Notice during public_html inspection: {e}")

              # 3. Upload extract_vendor.php into public_html so web request can trigger it
              helper_file = 'backend/extract_vendor.php' if os.path.exists('backend/extract_vendor.php') else 'extract_vendor.php'
              if os.path.exists(helper_file):
                  try:
                      with open(helper_file, 'rb') as hf:
                          ftp.storbinary(f"STOR {frontend_dir}extract_vendor.php", hf)
                      print(f"Uploaded extraction helper to {frontend_dir}extract_vendor.php")
                  except Exception as e:
                      print(f"Notice on extraction helper upload: {e}")

              # 4. Upload migrate_backend.php into public_html
              migrate_file = 'frontend/public/migrate_backend.php'
              if os.path.exists(migrate_file):
                  try:
                      with open(migrate_file, 'rb') as mf:
                          ftp.storbinary(f"STOR {frontend_dir}migrate_backend.php", mf)
                      print(f"Uploaded migration helper to {frontend_dir}migrate_backend.php")
                  except Exception as e:
                      print(f"Notice on migration helper upload: {e}")

              if ftp:
                  try:
                      ftp.quit()
                  except Exception:
                      pass
          except Exception as e:
              print(f"Warning during FTP detection/migration: {e}")

          # Write outputs to GITHUB_OUTPUT
          github_output = os.environ.get('GITHUB_OUTPUT')
          if github_output:
              with open(github_output, 'a') as f:
                  f.write(f"frontend_dir={frontend_dir}\n")
                  f.write(f"backend_dir={backend_dir}\n")
                  f.write(f"target_dir={frontend_dir}\n")
                  if working_server:
                      f.write(f"ftp_server={working_server}\n")
          print(f"Final Output Frontend Dir: '{frontend_dir}'")
          print(f"Final Output Backend Dir:  '{backend_dir}'")
          print(f"Final Output FTP Server:   '{working_server}'")
          PYEOF

      - name: FTP Upload Backend
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.detect-target.outputs.ftp_server || secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          server-dir: ${{ steps.detect-target.outputs.backend_dir }}
          local-dir: ./backend/
          port: 21
          protocol: ftp
          timeout: 180000
          exclude: |
            **/.git*
            **/.git*/**
            **/.env*
            **/storage/**
            **/node_modules/**
            **/tests/**
            **/vendor/**

      - name: Trigger Server-side Vendor Extraction & Migration
        env:
          FTP_HOST: ${{ secrets.HOSTINGER_FTP_SERVER }}
          APP_URL: ${{ secrets.HOSTINGER_APP_URL || secrets.APP_URL }}
        run: |
          CLEAN_HOST="${FTP_HOST#ftp.}"
          TOKEN="${{ env.EXTRACT_TOKEN }}"
          echo "Attempting to trigger vendor extraction & migration helper on server..."

          URLS=()
          if [ -n "$APP_URL" ]; then
            URLS+=("${APP_URL%/}/migrate_backend.php?token=${TOKEN}")
            URLS+=("${APP_URL%/}/extract_vendor.php?token=${TOKEN}")
            URLS+=("${APP_URL%/}/api/health")
          fi
          URLS+=(
            "https://${CLEAN_HOST}/migrate_backend.php?token=${TOKEN}"
            "https://${CLEAN_HOST}/extract_vendor.php?token=${TOKEN}"
            "https://${CLEAN_HOST}/api/health"
            "http://${CLEAN_HOST}/migrate_backend.php?token=${TOKEN}"
            "http://${CLEAN_HOST}/extract_vendor.php?token=${TOKEN}"
            "http://${CLEAN_HOST}/api/health"
          )

          TRIGGERED=false
          for URL in "${URLS[@]}"; do
            echo "Testing URL: $URL"
            RESP=$(curl -s -k --max-time 20 "$URL" || true)
            if echo "$RESP" | grep -q "SUCCESS"; then
              echo "Vendor extraction confirmed successfully via $URL"
              TRIGGERED=true
              break
            elif echo "$RESP" | grep -q "online"; then
              echo "PulseFit Pro API is already online and verified via $URL"
              TRIGGERED=true
              break
            fi
          done

          if [ "$TRIGGERED" = false ]; then
            echo "Remote extraction trigger finished. If domain DNS or SSL is pending, index.php auto-extracts vendor.zip on first incoming web request."
          fi

      - name: Run Remote Database Migrations
        env:
          APP_URL: ${{ secrets.HOSTINGER_APP_URL || secrets.APP_URL || 'https://archfit.archenterprises.co.in' }}
        run: |
          echo "Triggering remote database migrations..."
          MIGRATE_URL="${APP_URL%/}/api/setup-database?key=pulsefit_setup_2026&seed=false"
          RESP=$(curl -s -k --max-time 45 "$MIGRATE_URL" || true)
          echo "Migration execution response: $RESP"

  deploy-frontend:
    name: Deploy Frontend (React Vite SPA)
    runs-on: ubuntu-latest
    needs: deploy-backend
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Build React Frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://archfit.archenterprises.co.in/api/v1
        run: npm run build

      - name: Verify Production .htaccess in dist
        working-directory: frontend
        run: |
          if [ ! -f dist/.htaccess ]; then
            echo "Copying public/.htaccess to dist/.htaccess..."
            cp public/.htaccess dist/.htaccess
          fi
          test -f dist/.htaccess && echo ".htaccess confirmed in dist/"

      - name: Brief Cooldown for Hostinger FTP Connection Pool
        run: |
          echo "Pausing 20 seconds to allow Hostinger to release backend FTP sockets..."
          sleep 20

      - name: Deploy Frontend to Hostinger (Resilient Direct FTP)
        id: ftp-frontend-deploy
        env:
          FTP_SERVER: ${{ needs.deploy-backend.outputs.ftp_server || secrets.HOSTINGER_FTP_SERVER }}
          FTP_USER: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          SERVER_DIR: ${{ needs.deploy-backend.outputs.frontend_dir || needs.deploy-backend.outputs.target_dir || 'public_html/' }}
        run: |
          python3 - << 'PYEOF'
          import os, sys, time, socket, ftplib

          raw_server = os.environ.get('FTP_SERVER', '').strip()
          user = os.environ.get('FTP_USER', '').strip()
          password = os.environ.get('FTP_PASS', '').strip()
          server_dir = (os.environ.get('SERVER_DIR') or 'public_html/').strip()
          local_dir = './frontend/dist'

          print(f"Target base server: {raw_server}")
          print(f"Target directory: {server_dir}")

          candidates = []
          if raw_server:
              candidates.append(raw_server)
              if not raw_server.startswith('ftp.') and not raw_server.replace('.', '').isdigit():
                  candidates.append(f"ftp.{raw_server}")
          candidates.extend(['ftp.archfit.archenterprises.co.in', 'ftp.archenterprises.co.in', '145.79.210.95'])
          seen = set()
          candidate_servers = [c for c in candidates if c and not (c in seen or seen.add(c))]

          def connect_ftp():
              for s in candidate_servers:
                  try:
                      print(f"\nEvaluating FTP candidate: {s}...")
                      addr_info = socket.getaddrinfo(s, 21, socket.AF_INET, socket.SOCK_STREAM)
                      if not addr_info:
                          continue
                      ip = addr_info[0][4][0]
                      print(f"  -> Resolved {s} to IPv4: {ip}")

                      sock = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
                      sock.settimeout(6.0)
                      sock.connect((ip, 21))
                      sock.close()
                      print(f"  -> Port 21 is open on {s} ({ip})")

                      for use_tls in [True, False]:
                          try:
                              if use_tls:
                                  ftp = ftplib.FTP_TLS(timeout=45)
                                  ftp.connect(ip, 21)
                                  ftp.login(user, password)
                                  ftp.prot_p()
                                  ftp.set_pasv(True)
                                  print(f"  -> Connected via FTPS (TLS) to {s} ({ip}) successfully!")
                                  return ftp, s
                              else:
                                  ftp = ftplib.FTP(timeout=45)
                                  ftp.connect(ip, 21)
                                  ftp.login(user, password)
                                  ftp.set_pasv(True)
                                  print(f"  -> Connected via plain FTP to {s} ({ip}) successfully!")
                                  return ftp, s
                          except Exception as e:
                              print(f"     Login attempt ({'FTPS' if use_tls else 'FTP'}) on {s} failed: {e}")
                  except Exception as e:
                      print(f"  -> Candidate {s} connection failed: {e}")
              return None, None

          def ensure_remote_dir(ftp, remote_dir):
              parts = [p for p in remote_dir.replace('\\', '/').split('/') if p]
              ftp.cwd('/')
              for p in parts:
                  try:
                      ftp.cwd(p)
                  except Exception:
                      try:
                          ftp.mkd(p)
                      except Exception:
                          pass
                      ftp.cwd(p)

          def upload_directory(ftp, local_path, remote_path):
              ensure_remote_dir(ftp, remote_path)
              files_uploaded = 0
              total_bytes = 0
              for item in sorted(os.listdir(local_path)):
                  if item.startswith('.git'):
                      continue
                  l_item = os.path.join(local_path, item)
                  if os.path.isdir(l_item):
                      sub_remote = f"{remote_path.rstrip('/')}/{item}"
                      sub_files, sub_bytes = upload_directory(ftp, l_item, sub_remote)
                      files_uploaded += sub_files
                      total_bytes += sub_bytes
                      ensure_remote_dir(ftp, remote_path)
                  else:
                      with open(l_item, 'rb') as f:
                          size = os.path.getsize(l_item)
                          ftp.storbinary(f"STOR {item}", f)
                          files_uploaded += 1
                          total_bytes += size
                          print(f"  [OK] Uploaded {item} ({size:,} bytes) -> {remote_path}")
              return files_uploaded, total_bytes

          success = False
          for attempt in range(1, 4):
              print(f"\n=== Frontend Deployment Attempt {attempt}/3 ===")
              ftp, host = connect_ftp()
              if ftp:
                  try:
                      t0 = time.time()
                      count, b_total = upload_directory(ftp, local_dir, server_dir)
                      elapsed = time.time() - t0
                      print(f"\nSUCCESS: Deployed {count} frontend files ({b_total:,} bytes) in {elapsed:.1f}s to {host}:{server_dir}!")
                      try:
                          ftp.quit()
                      except Exception:
                          pass
                      success = True
                      break
                  except Exception as e:
                      print(f"Error during file transfer on attempt {attempt}: {e}")
                      try:
                          ftp.close()
                      except Exception:
                          pass
              if attempt < 3:
                  wait_time = attempt * 15
                  print(f"Waiting {wait_time}s before retry...")
                  time.sleep(wait_time)

          if not success:
              print("ERROR: All frontend deployment attempts failed.")
              sys.exit(1)
          PYEOF
