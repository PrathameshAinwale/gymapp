name: Deploy to Hostinger Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production_deployment
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy to Hostinger
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY || secrets.SSH_KEY || secrets.PRIVATE_KEY || secrets.DEPLOY_KEY || secrets.SSH_DEPLOY_KEY }}
      SSH_HOST: ${{ secrets.SSH_HOST || secrets.HOST || secrets.HOSTINGER_HOST }}
      SSH_USER: ${{ secrets.SSH_USERNAME || secrets.SSH_USER || secrets.HOSTINGER_USER || secrets.USERNAME }}
      SSH_PORT: ${{ secrets.SSH_PORT || secrets.PORT || '65002' }}
      TARGET_DIR: ${{ secrets.SSH_TARGET_DIR || secrets.TARGET_DIR || 'public_html' }}

    steps:
      # Step 1: Checkout Repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Node.js for React (Vite) Build
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      # Step 3: Install Dependencies & Build Frontend
      - name: Build React Frontend
        working-directory: ./frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || '' }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_URL || '' }}
        run: |
          npm ci || npm install
          npm run build

      # Step 4: Copy Frontend Dist Build into Laravel Public Directory
      - name: Copy Frontend Assets to Laravel Public
        run: |
          echo "Copying compiled React assets from frontend/dist/ to backend/public/..."
          cp -r frontend/dist/* backend/public/
          ls -la backend/public/

      # Step 5: Set up PHP for Composer Dependencies
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, curl, zip
          coverage: none

      # Step 6: Install Composer Dependencies (Production only, no dev)
      - name: Install Composer Dependencies
        working-directory: ./backend
        run: |
          composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      # Step 7: Configure SSH Key for Hostinger
      - name: Setup SSH Connection
        run: |
          mkdir -p ~/.ssh
          
          # Normalize and repair private key formatting (handles collapsed newlines, spaces, CRLF, base64)
          node -e "
          const fs = require('fs');
          const path = require('path');
          let key = (process.env.SSH_KEY || '').trim();
          if (!key) {
            console.error('ERROR: SSH_PRIVATE_KEY secret is empty! Please configure it in GitHub Settings > Secrets.');
            process.exit(1);
          }
          if (!key.includes('BEGIN') && !key.includes('PRIVATE KEY')) {
            try { key = Buffer.from(key, 'base64').toString('utf8'); } catch(e){}
          }
          key = key.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
          if (!key.includes('\n') || key.split('\n').length <= 2) {
            const match = key.match(/(-----BEGIN [^-]+-----)\s+(.+)\s+(-----END [^-]+-----)/);
            if (match) {
              const header = match[1];
              const bodyWords = match[2].trim().split(/\s+/);
              const footer = match[3];
              key = header + '\n' + bodyWords.join('\n') + '\n' + footer + '\n';
            }
          }
          if (!key.endsWith('\n')) key += '\n';
          const keyPath = path.join(process.env.HOME, '.ssh', 'deploy_key');
          fs.writeFileSync(keyPath, key, { mode: 0o600 });
          console.log('SSH key successfully written and permissions set to 600.');
          "
          
          # Validate key syntax
          echo "Validating SSH key syntax with ssh-keygen..."
          ssh-keygen -y -f ~/.ssh/deploy_key || {
            echo "ERROR: The SSH key could not be parsed by ssh-keygen."
            exit 1
          }
          
          cp ~/.ssh/deploy_key ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          
          ssh-keyscan -p $SSH_PORT -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          chmod 644 ~/.ssh/known_hosts
          
          echo "Testing SSH connection to Hostinger ($SSH_USER@$SSH_HOST:$SSH_PORT)..."
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 -p $SSH_PORT -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" "echo 'SSH connection to Hostinger successful! Server user:' && whoami"

      # Step 8: Sync Application Files to Hostinger via Rsync
      - name: Sync Files to Hostinger via Rsync
        run: |
          echo "Starting rsync deployment to $SSH_USER@$SSH_HOST:$TARGET_DIR ..."
          
          rsync -avz --delete \
            -e "ssh -p $SSH_PORT -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            --exclude='.env' \
            --exclude='.git*' \
            --exclude='node_modules' \
            --exclude='tests' \
            --exclude='storage/app/public/*' \
            --exclude='storage/framework/sessions/*' \
            --exclude='storage/framework/views/*' \
            --exclude='storage/framework/cache/*' \
            --exclude='storage/logs/*' \
            backend/ "$SSH_USER@$SSH_HOST:$TARGET_DIR/"

      # Step 9: Post-Deploy Remote Commands on Hostinger
      - name: Execute Post-Deployment Commands via SSH
        run: |
          echo "Executing remote post-deployment commands on Hostinger..."
          ssh -o StrictHostKeyChecking=no -p $SSH_PORT -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" << 'EOF'
            TARGET="${SSH_TARGET_DIR:-public_html}"
            [ -d "$TARGET" ] && cd "$TARGET" || cd public_html
            
            echo "Working in directory: $(pwd)"
            
            # 1. Ensure required storage and cache directories exist
            mkdir -p storage/framework/{sessions,views,cache/data} storage/logs bootstrap/cache
            
            # 2. Fix directory permissions (775 for storage and cache)
            chmod -R 775 storage bootstrap/cache
            
            # 3. Create storage symlink if not already created
            php artisan storage:link || true
            
            # 4. Run database migrations safely
            echo "Running Laravel database migrations..."
            php artisan migrate --force
            
            # 5. Optimize configuration, routes, and view caches
            echo "Caching configuration and routes for production..."
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            
            # 6. Restart background queue workers if configured
            php artisan queue:restart || true
            
            echo "Deployment to Hostinger completed successfully!"
          EOF
