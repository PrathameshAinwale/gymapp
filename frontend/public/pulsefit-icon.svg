<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Metallic White/Silver Gradient -->
    <linearGradient id="icon-silver" x1="120" y1="80" x2="380" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#F1F5F9" />
      <stop offset="70%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- Neon Lime Green Gradient -->
    <linearGradient id="icon-green" x1="150" y1="200" x2="380" y2="350" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#86EFAC" />
      <stop offset="30%" stop-color="#4ADE80" />
      <stop offset="70%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>

    <!-- Pulse Line Gradient -->
    <linearGradient id="icon-pulse" x1="60" y1="250" x2="440" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="50%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#4ADE80" />
    </linearGradient>

    <!-- Barbell Metallic Gradient -->
    <linearGradient id="icon-barbell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- Glowing Aura -->
    <filter id="icon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Soft Aura -->
  <circle cx="250" cy="245" r="170" fill="#22C55E" opacity="0.15" filter="url(#icon-glow)" />

  <!-- 1. Main Stylized "P" - Top Arch and Stem -->
  <path
    d="M 195 85 
       L 320 85 
       C 365 85 395 110 395 155 
       C 395 200 365 225 320 225 
       L 260 225 
       L 260 270 
       L 320 270 
       C 385 270 425 225 425 155 
       C 425 80 375 55 300 55 
       L 180 55 
       C 165 55 155 65 152 80 
       L 115 300 
       C 112 315 122 330 138 330 
       L 175 330 
       L 195 85 Z"
    fill="url(#icon-silver)"
  />

  <!-- 2. Main Stylized "P" - Lower Green Swoosh -->
  <path
    d="M 190 270 
       L 175 375 
       C 172 392 184 405 200 405 
       L 245 405 
       C 255 405 264 398 266 388 
       L 278 315 
       C 310 315 365 305 385 240 
       C 388 230 380 220 370 220 
       C 355 245 315 270 265 270 
       L 190 270 Z"
    fill="url(#icon-green)"
  />

  <!-- 3. Inner White Curve of 'P' (The Loop Opening) -->
  <path
    d="M 230 115 
       L 310 115 
       C 340 115 360 130 360 155 
       C 360 180 340 195 310 195 
       L 218 195 
       L 230 115 Z"
    fill="#0B0F19"
  />

  <!-- 4. Pulse Line -->
  <path
    d="M 100 250 
       L 205 250 
       L 225 270 
       L 255 130 
       L 285 295 
       L 305 250 
       L 400 250"
    stroke="url(#icon-pulse)"
    stroke-width="18"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M 100 250 
       L 205 250 
       L 225 270 
       L 255 130 
       L 285 295 
       L 305 250 
       L 400 250"
    stroke="#FFFFFF"
    stroke-width="6"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.85"
  />

  <!-- 5. Left Dumbbell Weights -->
  <rect x="68" y="210" width="12" height="80" rx="4" fill="url(#icon-barbell)" />
  <rect x="83" y="195" width="14" height="110" rx="5" fill="url(#icon-barbell)" />
  <rect x="100" y="205" width="12" height="90" rx="4" fill="url(#icon-barbell)" />
  <rect x="60" y="244" width="55" height="12" rx="3" fill="#E2E8F0" />

  <!-- 6. Right Dumbbell Weights -->
  <rect x="388" y="205" width="12" height="90" rx="4" fill="url(#icon-barbell)" />
  <rect x="403" y="195" width="14" height="110" rx="5" fill="url(#icon-barbell)" />
  <rect x="420" y="210" width="12" height="80" rx="4" fill="url(#icon-barbell)" />
  <rect x="385" y="244" width="55" height="12" rx="3" fill="#E2E8F0" />
</svg>
