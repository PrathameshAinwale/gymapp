<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="fav-silver" x1="120" y1="80" x2="380" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <linearGradient id="fav-green" x1="150" y1="200" x2="380" y2="350" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#86EFAC" />
      <stop offset="40%" stop-color="#4ADE80" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>
    <linearGradient id="fav-pulse" x1="60" y1="250" x2="440" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="50%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#4ADE80" />
    </linearGradient>
    <linearGradient id="fav-barbell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
  </defs>

  <!-- Dark Rounded Container for Favicon Visibility on all browsers -->
  <rect width="500" height="500" rx="110" fill="#0A0F1D" />
  <rect width="492" height="492" x="4" y="4" rx="106" fill="none" stroke="#22C55E" stroke-width="8" stroke-opacity="0.3" />

  <!-- Stylized "P" -->
  <path
    d="M 195 85 L 320 85 C 365 85 395 110 395 155 C 395 200 365 225 320 225 L 260 225 L 260 270 L 320 270 C 385 270 425 225 425 155 C 425 80 375 55 300 55 L 180 55 C 165 55 155 65 152 80 L 115 300 C 112 315 122 330 138 330 L 175 330 L 195 85 Z"
    fill="url(#fav-silver)"
  />

  <path
    d="M 190 270 L 175 375 C 172 392 184 405 200 405 L 245 405 C 255 405 264 398 266 388 L 278 315 C 310 315 365 305 385 240 C 388 230 380 220 370 220 C 355 245 315 270 265 270 L 190 270 Z"
    fill="url(#fav-green)"
  />

  <path
    d="M 230 115 L 310 115 C 340 115 360 130 360 155 C 360 180 340 195 310 195 L 218 195 L 230 115 Z"
    fill="#0A0F1D"
  />

  <!-- Pulse Line -->
  <path
    d="M 90 250 L 205 250 L 225 270 L 255 130 L 285 295 L 305 250 L 410 250"
    stroke="url(#fav-pulse)"
    stroke-width="20"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M 90 250 L 205 250 L 225 270 L 255 130 L 285 295 L 305 250 L 410 250"
    stroke="#FFFFFF"
    stroke-width="6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Barbell Plates -->
  <rect x="58" y="210" width="14" height="80" rx="4" fill="url(#fav-barbell)" />
  <rect x="75" y="195" width="16" height="110" rx="5" fill="url(#fav-barbell)" />
  <rect x="94" y="205" width="14" height="90" rx="4" fill="url(#fav-barbell)" />

  <rect x="392" y="205" width="14" height="90" rx="4" fill="url(#fav-barbell)" />
  <rect x="409" y="195" width="16" height="110" rx="5" fill="url(#fav-barbell)" />
  <rect x="428" y="210" width="14" height="80" rx="4" fill="url(#fav-barbell)" />
</svg>