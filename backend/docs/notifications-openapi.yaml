openapi: 3.0.3
info:
  title: PulseFit Notifications API
  description: Production-grade Event-Driven Notifications API with Server-Sent Events (SSE), HTTP caching (ETags), cursor pagination, and unread count caching.
  version: 1.0.0
servers:
  - url: /api/v1
    description: Current API Version 1
paths:
  /notifications:
    get:
      summary: Retrieve paginated notifications and summary
      description: |
        Returns unified notifications for the current user and gym, with backward-compatible summary metrics
        (payment_due, plan_expiring, unread_count), cursor pagination, and ETag caching.
      parameters:
        - name: cursor
          in: query
          description: Cursor ID for the next page of notifications
          required: false
          schema:
            type: string
        - name: limit
          in: query
          description: Number of notifications to return (1-100, default 20)
          required: false
          schema:
            type: integer
            default: 20
        - name: type
          in: query
          description: Filter by notification type (e.g., payment_due, plan_expiring, alert)
          required: false
          schema:
            type: string
        - name: is_read
          in: query
          description: Filter by read status (true/false)
          required: false
          schema:
            type: boolean
        - name: since
          in: query
          description: Unix timestamp or ISO date to fetch only notifications created after this time (catch-up on reconnect)
          required: false
          schema:
            type: string
        - name: If-None-Match
          in: header
          description: ETag from previous response to perform conditional 304 validation
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Notifications list and summary
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  today:
                    type: string
                  unread_count:
                    type: integer
                  summary:
                    type: object
                  payment_due:
                    type: object
                  plan_expiring:
                    type: object
                  items:
                    type: array
                    items:
                      type: object
                  next_cursor:
                    type: string
                    nullable: true
                  has_more:
                    type: boolean
        '304':
          description: Not Modified (content matches client ETag)
        '401':
          description: Unauthenticated

  /notifications/unread-count:
    get:
      summary: Get fast cached unread notification count
      description: Returns the cached unread count for the authenticated user with ETag support.
      responses:
        '200':
          description: Unread notification count
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  unread_count:
                    type: integer
        '304':
          description: Not Modified

  /notifications/stream:
    get:
      summary: Real-Time Server-Sent Events (SSE) Stream
      description: |
        Opens a persistent real-time event stream. Pushes notification events immediately upon creation
        without polling. Emits heartbeat keep-alive pings every 15 seconds.
      parameters:
        - name: token
          in: query
          description: Sanctum API Bearer token for EventSource authentication
          required: false
          schema:
            type: string
        - name: since
          in: query
          description: Last seen event timestamp or ID for catch-up
          required: false
          schema:
            type: string
      responses:
        '200':
          description: SSE event stream
          content:
            text/event-stream:
              schema:
                type: string

  /notifications/read:
    post:
      summary: Mark a notification as read (idempotent)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                type:
                  type: string
                reference_id:
                  type: string
      responses:
        '200':
          description: Marked as read successfully

  /notifications/mark-all-read:
    post:
      summary: Mark all notifications as read today for user (idempotent)
      responses:
        '200':
          description: All notifications marked as read

  /notifications/{id}:
    delete:
      summary: Delete a notification
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Notification deleted

  /notifications/member-ids:
    get:
      summary: Filter member IDs matching notification type
      parameters:
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [payment_due, plan_expiring]
      responses:
        '200':
          description: Array of matching member IDs

